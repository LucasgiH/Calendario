<!DOCTYPE html>
<!-- colocando primeira fivela lado esquerdo calendario -->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu calendário</title>

    <style>
        canvas {
            display: block;
            width: 100%;
            max-width: 350px;
            height: auto;
            border: 2px dotted black;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <canvas id="meuCanvas" width="350" height="250"></canvas>
    
    <script>
        const canvas = document.getElementById("meuCanvas");
        const ctx = canvas.getContext("2d");
        
        // Frente da base
        ctx.fillStyle = "brown";
        ctx.fillRect(25, 180, 300, 25);
        
        // Parte superior da base
        ctx.fillStyle = "#A66A3F";
        ctx.beginPath();
        ctx.moveTo(25, 180);
        ctx.lineTo(45, 165);
        ctx.lineTo(305, 165);
        ctx.lineTo(325, 180);
        ctx.closePath();
        ctx.fill();
        
        // Haste esquerda do calendário
        ctx.strokeStyle = "#9B6349";
        ctx.lineWidth = 4;

        ctx.beginPath();
        ctx.moveTo(50, 175);
        ctx.lineTo(50, 65);
        ctx.stroke();
        
        // Haste superior do calendário
        ctx.beginPath();
        ctx.moveTo(50, 65);

        // Curva arredondada da esquerda
        ctx.quadraticCurveTo(50, 50, 65, 50);

        // Barra horizontal
        ctx.lineTo(285, 50);

        // Curva arredondada da direita
        ctx.quadraticCurveTo(300, 50, 300, 65);

        ctx.stroke();
        
        ctx.beginPath();
        ctx.moveTo(300, 175);
        ctx.lineTo(300, 65);
        ctx.stroke();
        /*
        // Primeira argola do calendário
        ctx.beginPath();
        // centro (87, 68), raio 12; começa em -60° e dá a volta quase toda
        ctx.arc(87, 62, 12, -Math.PI / 2, -2.7 * Math.PI / 3);
        ctx.stroke();*/
        ctx.lineWidth = 3.3;
        ctx.beginPath();
        ctx.ellipse(93, 63, 5, 14, 0, -Math.PI / 3, -2.7 * Math.PI / 3);
        ctx.stroke();
    </script>
</body>
</html>
