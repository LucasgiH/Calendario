<!DOCTYPE html>
<!-- colocando cartao argola -->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu calendário</title>

    <style>
        canvas {
            display: block;
            width: 100%;
            max-width: 350px;
            height: auto;
            border: 2px dotted black;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <canvas id="meuCanvas" width="350" height="250"></canvas>
    
    <script>
        const canvas = document.getElementById("meuCanvas");
        const ctx = canvas.getContext("2d");
        
        // Frente da base
        ctx.fillStyle = "brown";
        ctx.fillRect(25, 180, 300, 25);
        
        // Parte superior da base
        ctx.fillStyle = "#A66A3F";
        ctx.beginPath();
        ctx.moveTo(25, 180);
        ctx.lineTo(45, 165);
        ctx.lineTo(305, 165);
        ctx.lineTo(325, 180);
        ctx.closePath();
        ctx.fill();
        
        // Haste esquerda do calendário
        ctx.strokeStyle = "#9B6349";
        ctx.lineWidth = 4;

        ctx.beginPath();
        ctx.moveTo(50, 175);
        ctx.lineTo(50, 65);
        ctx.stroke();
        
        // Haste superior do calendário
        ctx.beginPath();
        ctx.moveTo(50, 65);

        // Curva arredondada da esquerda
        ctx.quadraticCurveTo(50, 50, 65, 50);

        // Barra horizontal
        ctx.lineTo(285, 50);

        // Curva arredondada da direita
        ctx.quadraticCurveTo(300, 50, 300, 65);

        ctx.stroke();
        
        ctx.beginPath();
        ctx.moveTo(300, 175);
        ctx.lineTo(300, 65);
        ctx.stroke();
        
        // Primeiro cartão (centralizado na primeira argola, x = 96)
        /*const cartaoLargura = 42;
        const cartaoAltura = 88;
        const cartaoX = 96 - cartaoLargura / 2; // 75
        const cartaoY = 66;
        
        ctx.fillStyle = "blue";
        ctx.beginPath();
        ctx.roundRect(cartaoX, cartaoY, cartaoLargura, cartaoAltura, 5);
        ctx.fill();
        
        function desenharArgola(x) {
            ctx.lineWidth = 3.3;
            ctx.beginPath();
            ctx.ellipse(x, 63, 2.5, 14, 0, -Math.PI / 3, -2.7 * Math.PI / 3);
            ctx.stroke();
        }
        
        for (let i = 0; i < 4; i++) {
            desenharArgola(96 + i * 52);
        }*/
        function desenharArgola(x, parte) {
            ctx.strokeStyle = "#9B6349";
            ctx.lineWidth = 3.3;
            ctx.beginPath();
            if (parte === "tras") {
                // metade direita
                ctx.ellipse(x, 63, 2.5, 14, 0, -Math.PI / 3, Math.PI / 2);
            } else {
                // metade esquerda, até o começo da abertura
                ctx.ellipse(x, 63, 2.5, 14, 0, Math.PI / 2, 1.1 * Math.PI);
            }
            ctx.stroke();
        }
        
        function desenharCartao(x) {
            const largura = 42, altura = 88;
            ctx.fillStyle = "blue";
            ctx.beginPath();
            ctx.roundRect(x - largura / 2, 69, largura, altura, 5);
            // furo: círculo no mesmo caminho, vazado com "evenodd"
            ctx.moveTo(x + 3.5, 77);
            ctx.arc(x, 77, 3.5, 0, 2 * Math.PI);
            ctx.fill("evenodd");
        }
        
        desenharArgola(96, "tras");   // 1º: parte de trás da argola
        desenharCartao(96);           // 2º: cartão com furo
        desenharArgola(96, "frente"); // 3º: parte da frente, por cima
    </script>
</body>
</html>
