<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu calendário</title>

    <style>
        canvas {
            display: block;
            width: 100%;
            max-width: 350px;
            height: auto;
            border: 2px dotted black;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <canvas id="meuCanvas" width="350" height="250"></canvas>
    
    <script>
        const canvas = document.getElementById("meuCanvas");
        const ctx = canvas.getContext("2d");
        
        // Frente da base
        ctx.fillStyle = "brown";
        ctx.fillRect(25, 180, 300, 25);
        
        // Parte superior da base
        ctx.fillStyle = "#A66A3F";
        ctx.beginPath();
        ctx.moveTo(25, 180);
        ctx.lineTo(45, 165);
        ctx.lineTo(305, 165);
        ctx.lineTo(325, 180);
        ctx.closePath();
        ctx.fill();
    </script>
</body>
</html>
